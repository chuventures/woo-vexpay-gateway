name: Release zip

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build plugin zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist/vexpay-gateway-for-woocommerce
          rsync -a --exclude-from=.distignore ./ dist/vexpay-gateway-for-woocommerce/
          cd dist
          zip -r "vexpay-gateway-for-woocommerce-${VERSION}.zip" vexpay-gateway-for-woocommerce
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/vexpay-gateway-for-woocommerce-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
