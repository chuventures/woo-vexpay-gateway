name: Release zip

on:
  push:
    tags:
      - 'v*'

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build plugin zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist/woo-vexpay-gateway
          rsync -a --exclude-from=.distignore ./ dist/woo-vexpay-gateway/
          cd dist
          zip -r "woo-vexpay-gateway-${VERSION}.zip" woo-vexpay-gateway
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/woo-vexpay-gateway-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
